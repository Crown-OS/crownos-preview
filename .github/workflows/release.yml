# Builds an Arch package on a v* tag and publishes it on the release
# Logic lives in Crown-OS/.github.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    uses: Crown-OS/.github/.github/workflows/arch-package.yml@main
    with:
      packages: libheif poppler-glib cairo gstreamer gst-plugins-base-libs
      depends: >-
        wayland libxkbcommon vulkan-icd-loader
        gst-plugins-base gst-plugins-good gst-libav gst-plugin-pipewire
    secrets: inherit
